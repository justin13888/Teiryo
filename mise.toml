[tools]
rust = { version = "stable", components = "rustfmt,clippy" }
hk = "latest"
pkl = "latest"
"ubi:convco/convco" = { version = "latest", exe = "convco" }

[tasks.build]
description = "Build the whole workspace"
run = "cargo build --workspace"

[tasks.test]
description = "Run all tests"
run = "cargo test --workspace"

[tasks.fmt]
description = "Format all code"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check formatting without modifying files"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Lint with clippy, warnings are errors"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks."lint:fix"]
description = "Auto-fix clippy lints"
run = "cargo clippy --workspace --all-targets --fix --allow-dirty --allow-staged"

[tasks.check]
description = "Full local gate: format check, lint, tests"
depends = ["fmt:check", "lint", "test"]

[tasks.daemon]
description = "Run the teiryod daemon in the foreground"
run = "cargo run -p teiryod"

[tasks.tui]
description = "Run the teiryo TUI"
# teiryod must be built first: the TUI spawns it as a sibling of its own binary.
run = ["cargo build -p teiryod", "cargo run -p teiryo"]

[tasks.install]
description = "Install teiryo and teiryod, then restart the daemon"
# The same install as a release from scripts/install.sh, built from this
# checkout; the reasons for each step are in the script, where shellcheck
# reads them.
run = "scripts/install.sh --from-source"

[tasks.uninstall]
description = "Stop the daemon and remove the installed teiryo and teiryod"
# The daemon first: removing its binary while it still holds the socket leaves a
# running process no client can replace. An open TUI would respawn it from the
# binary about to be removed, so the task refuses while one runs, debug builds
# aside (see scripts/install.sh). The daemon unlinks its own socket on SIGTERM;
# one left by the SIGKILL fallback is cleared by the next daemon to take the
# lock.
run = [
  '''
set -eu
for tool in pgrep ps; do
  if ! command -v "$tool" >/dev/null 2>&1; then
    echo "uninstall: $tool is required to stop the daemon" >&2
    exit 1
  fi
done
uid=$(id -u)

# Debug builds are not counted; see scripts/install.sh.
binary_of() {
  if [ -r "/proc/$1/exe" ]; then
    readlink -f "/proc/$1/exe" 2>/dev/null || true
    return
  fi
  comm=$(ps -o comm= -p "$1" 2>/dev/null || true)
  case "$comm" in
    /*) readlink -f "$comm" 2>/dev/null || true ;;
  esac
}
release_pids() {
  for pid in $(pgrep -x -u "$uid" "$1" 2>/dev/null || true); do
    case "$(binary_of "$pid")" in
      */debug/"$1") ;;
      *) echo "$pid" ;;
    esac
  done
}

if [ -n "$(release_pids teiryo)" ]; then
  echo "uninstall: a teiryo TUI is running; quit it and re-run" >&2
  exit 1
fi

# Zombies hold no socket and cannot exit; see scripts/install.sh.
live_daemon_pids() {
  for pid in $(release_pids teiryod); do
    state=$(ps -o stat= -p "$pid" 2>/dev/null | tr -d " \t\n" || true)
    case "$state" in
      Z* | "") ;;
      *) echo "$pid" ;;
    esac
  done
}

pids=$(live_daemon_pids)
if [ -n "$pids" ]; then
  echo "uninstall: stopping the running teiryod"
  kill -TERM $pids 2>/dev/null || true
  waited=0
  while [ -n "$(live_daemon_pids)" ]; do
    waited=$((waited + 1))
    if [ "$waited" -gt 50 ]; then
      kill -KILL $(live_daemon_pids) 2>/dev/null || true
      break
    fi
    sleep 0.1
  done
fi
''',
  "cargo uninstall teiryo teiryod",
]

[tasks.release]
description = "Tag origin/master's head as a signed release and push the tag"
# The checks and their reasons are in the script, where shellcheck reads them.
run = "scripts/release.sh"

[tasks."release:dry"]
description = "Run every release check and print the version, without tagging"
run = "scripts/release.sh --dry-run"
