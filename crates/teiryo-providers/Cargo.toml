[package]
name = "teiryo-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Provider adapters (Claude, ...) for Teiryo"

[dependencies]
teiryo-core.workspace = true
async-trait.workspace = true
chrono.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
# The parser's operator signal is a `tracing` warning, so asserting it needs a
# subscriber to capture. Without one those warnings are executed and checked by
# nothing — deleting them left the whole suite green.
tracing-subscriber.workspace = true
