[package]
name = "teiryod"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Teiryo daemon: polls LLM subscription quotas and serves them over a Unix socket"

[dependencies]
teiryo-core.workspace = true
teiryo-providers.workspace = true
anyhow.workspace = true
bytes.workspace = true
chrono.workspace = true
directories.workspace = true
futures.workspace = true
libc = "0.2"
notify.workspace = true
serde.workspace = true
serde_json.workspace = true
# `io-std`: `teiryod bridge` relays its own stdin and stdout.
tokio = { workspace = true, features = ["io-std"] }
tokio-util.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true

[dev-dependencies]
async-trait.workspace = true
secrecy.workspace = true
# Paused-clock tests of the scheduler's waits.
tokio = { workspace = true, features = ["test-util"] }
