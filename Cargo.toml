[workspace]
resolver = "2"
members = [
    "crates/teiryo-core",
    "crates/teiryo-providers",
    "crates/teiryod",
    "crates/teiryo",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/justin13888/Teiryo"
# Never published to crates.io, so no package carries a version: a build is
# identified by its commit (see `teiryo_core::version`). Omitting `version`
# already implies this; it is spelled out so the intent does not rest on it.
publish = false

[workspace.dependencies]
teiryo-core = { path = "crates/teiryo-core" }
teiryo-providers = { path = "crates/teiryo-providers" }

anyhow = "1"
async-trait = "0.1"
bincode = { version = "2", features = ["serde"] }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
directories = "5"
futures = "0.3"
notify = "8"
proptest = "1"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
secrecy = { version = "0.10", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# `raw_value` keeps `limits[]` rows undecoded until each is examined on its
# own: without it the outer parse materialises every number in the array, so
# one unrepresentable value anywhere in it fails the whole poll.
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "net", "time", "signal", "sync", "io-util", "process", "fs"] }
tokio-util = { version = "0.7", features = ["codec"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }

# Full DWARF debug info bloats target/ under fast dev/test iteration. Line
# tables keep file:line in the workspace crates' backtraces; dependency frames
# keep their symbol names but lose file:line. For full debug info (locals and
# types in a debugger), override per build: `CARGO_PROFILE_DEV_DEBUG=2`
# (workspace crates) or
# `cargo --config 'profile.dev.package."*".debug=2' ...` (dependencies).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
